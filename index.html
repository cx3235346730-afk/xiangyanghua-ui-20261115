<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>向阳花随心选 · 设计对比</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;justify-content:center;background:#e9eaed;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#292a2d}.preview-shell{display:flex;flex-direction:column;width:min(100%,430px);height:100%;height:100dvh;background:#fff;box-shadow:0 0 38px #30282b12}.version-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;min-height:44px;padding:6px 12px;border-bottom:1px solid #e8e8eb;background:#fff}.version-label{font-size:12px;font-weight:700;color:#77787d;white-space:nowrap}.version-tabs{display:flex;gap:3px;padding:3px;border-radius:9px;background:#f1f4f1}.version-tabs button{min-width:72px;padding:6px 10px;border:0;border-radius:7px;background:transparent;color:#77787d;font:600 12px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}.version-tabs button[aria-selected="true"]{background:#fff;color:#355744;box-shadow:0 1px 4px #00000012}.version-tabs button:focus-visible{outline:2px solid #6d8d77;outline-offset:1px}.preview-frame{display:block;flex:1;width:100%;min-height:0;border:0;background:#f5f5f8}.preview-frame[hidden]{display:none}@media(max-width:320px){.version-label{font-size:11px}.version-tabs button{min-width:62px;padding-inline:8px}}
  </style>
</head>
<body>
  <main class="preview-shell">
    <div class="version-bar"><span class="version-label">设计方案</span><div class="version-tabs" role="tablist" aria-label="选择设计版本"><button type="button" id="tab-v1" role="tab" aria-selected="true" aria-controls="frame-v1">版本一</button><button type="button" id="tab-v2" role="tab" aria-selected="false" aria-controls="frame-v2">版本二</button><button type="button" id="tab-v3" role="tab" aria-selected="false" aria-controls="frame-v3">版本三</button></div></div>
    <iframe id="frame-v1" class="preview-frame" src="./v1.html?rev=warm-4" title="版本一界面"></iframe>
    <iframe id="frame-v2" class="preview-frame" src="./v2.html?rev=nav-4" title="版本二界面" hidden></iframe>
    <iframe id="frame-v3" class="preview-frame" src="./v3.html?rev=nav-4" title="版本三界面" hidden></iframe>
  </main>
  <script>
    for (const version of ['v1','v2','v3']) document.getElementById('tab-'+version).addEventListener('click',()=>{for(const item of ['v1','v2','v3']){const selected=item===version;document.getElementById('tab-'+item).setAttribute('aria-selected',String(selected));document.getElementById('frame-'+item).hidden=!selected;}});
  </script>
</body>
</html>
